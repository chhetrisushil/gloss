<svg xmlns="http://www.w3.org/2000/svg" width="489" height="578" viewBox="0 0 489 578" font-family="monospace" font-size="15">
<title>loops.gloss: feature start</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="154" y="16" width="141" height="36" rx="12" fill="white" stroke="black"/>
<text x="166" y="39">feature start</text>
<rect x="113" y="76" width="222" height="36" fill="white" stroke="black"/>
<text x="125" y="99">set xs to list of 1, 2</text>
<polygon points="122,154 140,136 308,136 326,154 308,172 140,172" fill="white" stroke="black"/>
<text x="152" y="159">for each x in xs</text>
<rect x="167" y="196" width="114" height="36" fill="white" stroke="black"/>
<text x="179" y="219">set n to x</text>
<polygon points="64,274 82,256 367,256 385,274 367,292 82,292" fill="white" stroke="black"/>
<text x="94" y="279">repeat while n is less than 3</text>
<rect x="167" y="316" width="114" height="36" fill="white" stroke="black"/>
<text x="179" y="339">add 1 to n</text>
<polygon points="95,414 113,396 335,396 353,414 335,432 113,432" fill="white" stroke="black"/>
<text x="125" y="419">for each i from 1 to 3</text>
<rect x="185" y="456" width="78" height="36" fill="white" stroke="black"/>
<text x="197" y="479">show i</text>
<rect x="199" y="526" width="51" height="36" rx="12" fill="white" stroke="black"/>
<text x="211" y="549">end</text>
<polyline points="224,52 224,76" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="224,112 224,136" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="224,172 224,196" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="228" y="184" font-size="12">next</text>
<polyline points="224,232 224,256" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="224,292 224,316" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="228" y="304" font-size="12">yes</text>
<polyline points="224,352 224,374 32,374 32,274 64,274" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="385,274 441,274 441,364 16,364 16,154 122,154" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="389" y="286" font-size="12">no</text>
<polyline points="326,154 457,154 457,384 224,384 224,396" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="330" y="166" font-size="12">done</text>
<polyline points="224,432 224,456" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="228" y="444" font-size="12">next</text>
<polyline points="224,492 224,504 48,504 48,414 95,414" fill="none" stroke="black" marker-end="url(#arrow)"/>
<polyline points="353,414 425,414 425,514 224,514 224,526" fill="none" stroke="black" marker-end="url(#arrow)"/>
<text x="357" y="426" font-size="12">done</text>
</svg>
